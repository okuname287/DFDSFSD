<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нет доступа — Londo</title>
    <link rel="stylesheet" href="/static/css/style.css?v=2026-ui">
</head>
<body>
    <main class="container pending-access-page">
        <section class="access-card access-denied-card">
            <div class="access-card-icon">!</div>
            <p class="eyebrow">Londo Family / Доступ</p>
            <h1>У вас нет доступа к разделам</h1>
            <p>Ваш профиль одобрен, но у аккаунта нет необходимой Discord-роли для рабочих разделов сайта.</p>
            <p>Обратитесь к Owner или ответственному сотруднику, чтобы вам выдали нужную роль на сервере Discord.</p>
            <p class="access-user">{{ user.username }}</p>
            <a href="/auth/logout" class="btn btn-outline">Выйти</a>
        </section>
    </main>
</body>
